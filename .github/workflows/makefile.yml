name: Makefile CI

on:
  workflow_dispatch:
    null

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
          sudo apt-get update
          sudo apt-get install libext2fs-dev
          
    - name: configure
      run: ./configure LDFLAGS=-Wl,--allow-multiple-definition

    - name: Run check
      run: make check

    - name: Run distcheck
      run: | #make distcheck
          ls
