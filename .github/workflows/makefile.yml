name: Makefile CI

on:
  workflow_dispatch:
    inputs:
        ncurses_typ:
            type: boolean
            description: 'Use ncursew'
            default: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
          sudo apt-get update
          sudo apt-get install libext2fs-dev
          sudo apt-get install libncurses-dev

    - name: Patch configure to switch to ncurcesew
      if: inputs.ncurses_typ
      run: sed -i "s/ncurses/ncursesw/" ./configure
          
    - name: configure
      run: ./configure LDFLAGS=-Wl,--allow-multiple-definition,--trace

    - name: Run compilation and check
      run: |
          make check
          ldd e2defrag

    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
          #name: dist-without-markdown
          path: |
            defrag
            e2defrag
            README
            NEWS
            AUTHORS
          if-no-files-found: error
