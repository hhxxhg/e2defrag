name: Makefile CI

on:
  workflow_dispatch:
    null

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
          sudo apt-get libext2fs-dev
          
    - name: configure
      run: ./configure

    - name: Run check
      run: make check

    - name: Run distcheck
      run: | #make distcheck
          ls
